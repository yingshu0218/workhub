# CNB -> GitHub 单向只读镜像
# 目标仓库: https://github.com/yingshu0218/workhub (私有)
# 触发: push 到 main 自动同步; 每日 03:00 (Asia/Shanghai) crontab 兜底
# 凭据: 密钥仓库 blueteam0715/keystore 的 github-sync.yml, 经 imports 注入
# 范围: 仅 main 分支 + 全部 tag (远端 70+ 个 auto/* 临时分支刻意不同步)

# 点开头的键是 YAML 隐藏键, 只作锚点用, 不会被当作分支名。
# 锚点是 YAML 文档级特性, 因此在 push 与 crontab 两个事件下引用同一份定义。
.mirror-to-github: &mirror-to-github
  name: mirror-cnb-to-github
  imports:
    - https://cnb.cool/blueteam0715/keystore/-/blob/main/github-sync.yml
  # 串行化: 快速连续 push 会并发 force-push, 若「旧」构建最后落地, GitHub 会停在
  # 旧提交 —— 而它的校验早已通过, 属静默陈旧。wait 让并发构建排队, 保证最新的最后落地。
  lock:
    key: cnb-to-github-mirror
    wait: true
    timeout: 900
  stages:
    # ① 让「插件找不到本地 main 就静默跳过」这个前提永不成立。
    #    插件源码对 $PLUGIN_BRANCH 做 git rev-parse --verify, 失败时只打印
    #    "Warning: ... skipping push" 然后 exit 0 —— 流水线全绿但什么都没同步。
    #    用 HEAD 而非 CNB_COMMIT: push 与 crontab 两种事件下 HEAD 都指向本次检出的提交。
    - name: ensure-local-main
      script: |
        git checkout -B main HEAD
        # 关掉 LFS 锁校验。本仓库没有任何 LFS 文件, 但插件每次都会 git lfs install 装上 pre-push 钩子,
        # 该钩子会去调远端 LFS 锁定 API —— 实测碰到过一次
        # "Post https://github.com/.../info/lfs/locks/verify: EOF" 导致推送失败(偶发, 未能稳定复现)。
        # 写进 .git/config: 与插件容器共享同一份工作区, 插件侧可见, 因此不需要额外提交 .lfsconfig 文件。
        git config lfs.locksverify false

    # ② 官方 Git Sync 插件: 推 main + 全部 tag
    #    retry: 2 —— 推 GitHub 走公网, 实测出现过偶发的 LFS/网络类失败(见 ensure-local-main 里的说明);
    #    该任务本身幂等(force 推送同一提交), 重试是安全的, 避免偶发网络抖动直接让镜像停摆。
    - name: sync-to-github
      image: tencentcom/git-sync
      retry: 2
      settings:
        target_url: https://github.com/yingshu0218/workhub.git
        auth_type: https
        # 插件容器收不到自定义环境变量(官方原文), 只能靠 settings 的变量替换
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}
        # 必须写 branch: 不写时插件执行 git push target --all, 会把 70+ 个 auto/* 分支全推上去
        branch: main
        push_tags: true
        # 只读镜像语义: 允许覆盖, 以容纳 tag 重指与 CNB 侧历史重写
        force: true

    # ③ 真正的防线。插件在异常路径上是「警告 + exit 0」, 所以不能只看它的退出码,
    #    必须读远端真实 ref 与本次构建 HEAD 比对, 把假阳性转成响亮失败。
    - name: verify-github-mirror
      script: |
        set -eu
        export GIT_TERMINAL_PROMPT=0
        export HOME="${HOME:-/root}"
        # 凭据落 credential store: token 只进文件、不进命令行, 日志里只会看到变量名
        # 必须先开 helper, 否则 ~/.git-credentials 不会被读（会退化成提示输密码, 而 GIT_TERMINAL_PROMPT=0 直接失败）
        # 用 echo 而非 printf: 不经任何 \n 转义(CNB 配置链路会解码反斜杠转义, 曾把一行劈成两行)
        git config --global credential.helper store
        echo "https://$GIT_USERNAME:$GIT_ACCESS_TOKEN@github.com" > "$HOME/.git-credentials"
        chmod 600 "$HOME/.git-credentials" 2>/dev/null || true

        REMOTE="https://github.com/yingshu0218/workhub.git"
        EXPECTED="$(git rev-parse HEAD)"
        RAW="$(git ls-remote "$REMOTE" refs/heads/main)"
        ACTUAL="${RAW%%[[:space:]]*}"

        echo "CNB HEAD    = $EXPECTED"
        echo "GitHub main = ${ACTUAL:-<none>}"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "ERROR: GitHub 镜像未同步到本次提交, 构建失败" >&2
          exit 1
        fi
        echo "OK: GitHub main == CNB HEAD"

        # 验收用: 把两侧 ref 清单打进日志, 便于核对
        #  - GitHub 侧 refs/heads 只应有 main (不应出现 auto/* 等临时分支)
        #  - refs/tags 应与 CNB 侧逐条一致
        # 注意: 这里必须用 --heads/--tags 或带通配的 "refs/tags/*"。
        # ls-remote 的模式是全名匹配、不是前缀匹配 —— 写 "refs/tags" 会静默返回空
        # (踩过: 打印了个空清单, 流水线却是绿的, 正是本项目最忌讳的假阳性)
        echo
        echo "===== GitHub 侧 ref ====="
        git ls-remote --heads --tags "$REMOTE"
        echo "heads 数 = $(git ls-remote --heads "$REMOTE" | wc -l) / tags 行数 = $(git ls-remote --tags "$REMOTE" | wc -l)"
        EXTRA_HEADS="$(git ls-remote --heads "$REMOTE" | grep -v 'refs/heads/main$' || true)"
        if [ -n "$EXTRA_HEADS" ]; then
          echo "WARNING: GitHub 侧出现 main 之外的分支, 只读镜像本不该有:" >&2
          echo "$EXTRA_HEADS" >&2
        fi
        echo "===== CNB 侧 ref (对比用) ====="
        git ls-remote origin "refs/heads/main" "refs/tags/*"

# ─────────────────────────────────────────────────────────────────────────────
# 质量门禁（2026-10-26 审计补）：镜像构建的**前置 stage**，不通过就不出镜像
#
# 为什么加：此前流水线只有「GitHub 镜像同步 + docker build」，lint / tsc / vitest
# 一个都不跑 —— 任何带红提交都能构建成镜像并推到 latest，回归完全依赖个人自律
# （历史记录里确实出现过「全量测试未跑完即交付」）。Dockerfile 里也只有 npm run build。
#
# ⚠️ 必须复用 `npm run check:all`（单一口径）：本仓 jsdom 用例要等
# IndexedDB → liveQuery → React 三跳，默认并发下会随机器负载假红；门禁里另写一遍
# 不带 --maxWorkers=4 的 vitest，只会得到随机红灯和「重跑一次变绿」的假结论。
.quality-gate: &quality-gate
  name: quality gate
  image: node:22-bookworm-slim # 与 Dockerfile 的 web/runtime 同版本，验的就是「能不能进镜像」
  script: |
    set -e
    npm ci
    npm run check:all

# ─────────────────────────────────────────────────────────────────────────────
# Web 版 docker 镜像：推送即构建，推到 CNB 制品库，VPS 上 docker pull 部署
#
# 只出 **Web 版**：手机端/桌面端（Tauri）由 .dockerignore 挡在构建上下文之外，
# 且 vite 的 tauriCspPlugin 靠 TAURI_ENV_PLATFORM 自判（这里不设该变量 → 插件空转）。
#
# 镜像名 = docker.cnb.cool/<组织>/<仓库>（同仓库同名制品的路径规则）；
# 推 CNB 自有制品库**不需要任何登录**，用流水线内置凭据即可。
.build-web-image: &build-web-image
  name: build-web-image
  services:
    - docker
  # 串行化: 连续 push 时若「旧」构建最后推完, latest 会退回旧镜像（静默陈旧）
  lock:
    key: build-web-image
    wait: true
    timeout: 1800
  stages:
    - <<: *quality-gate
    - name: docker build
      script: |
        set -e
        REPO="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
        # GIT_REVISION 进 OCI 标签, 用于「这个镜像对应哪个提交」的溯源
        docker build \
          --build-arg GIT_REVISION="${CNB_COMMIT}" \
          --build-arg PB_VERSION="${PB_VERSION:-0.40.2}" \
          -t "${REPO}:latest" \
          -t "${REPO}:${CNB_COMMIT_SHORT}" \
          .
    - name: docker push
      script: |
        set -e
        REPO="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
        # 先推可追溯的 sha, 再推 latest —— 中途失败时 latest 不会指向没推全的镜像
        docker push "${REPO}:${CNB_COMMIT_SHORT}"
        docker push "${REPO}:latest"

# ─────────────────────────────────────────────────────────────────────────────
# Android 构建环境镜像（一次性，仅 Dockerfile 变更时重建）
#
# 为什么单独一个 job：CNB 现成的 node 镜像没有 JDK/SDK/NDK/Rust。
# 把这些装进镜像后，tag 流水线只拉镜像，不再每次重下 3 GB。
# ⚠️ 顺序依赖：镜像必须先存在，tag 流水线才能用 —— 所以本 job 挂在 main 的 push 上，
#    由「.cnb/android/Dockerfile 有变更」触发；merge 后先跑一次再打 tag。
.android-builder-image: &android-builder-image
  name: build-android-builder-image
  ifModify:
    - ".cnb/android/Dockerfile"
  services:
    - docker
  lock:
    key: build-android-builder-image
    wait: true
    timeout: 3600
  stages:
    - name: docker build & push
      script: |
        set -e
        IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/android-builder:latest"
        docker build -f .cnb/android/Dockerfile -t "$IMAGE" .
        docker push "$IMAGE"

# ─────────────────────────────────────────────────────────────────────────────
# Android APK：**只在打 tag 时构建**
#
# 为什么只挂 tag：一次构建约 1~1.5 核时（4 核 × 15~20 分钟），
# 每次 push 都跑会把 160 核时/月的免费额度吃掉；发版频率远低于提交频率。
#
# 签名密钥在密钥仓库 blueteam0715/keystore 的 android-signing.yml，
# 通过 imports 注入为环境变量，**不落仓库、不进日志**。
.android-apk: &android-apk
  name: build-android-apk
  runner:
    cpus: 4
  docker:
    image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/android-builder:latest
    volumes:
      # Gradle 依赖与 Rust 产物跨构建复用；不缓存 ~/.cargo/~/.rustup —— 工具链已在镜像里，
      # 挂卷反而会用空卷盖住镜像内容（copy-on-write 的初始化语义不适合这里）。
      - /root/.gradle:copy-on-write
      - ./src-tauri/target:copy-on-write
  imports:
    - https://cnb.cool/blueteam0715/keystore/-/blob/main/android-signing.yml
  stages:
    - name: 写入签名配置
      script: |
        set -e
        if [ -z "$ANDROID_KEYSTORE_B64" ]; then
          echo "密钥仓库缺少 ANDROID_KEYSTORE_B64（见 docs/多端App改造方案-Tauri.md §12.8）" >&2
          exit 1
        fi
        echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/nexus-release.jks
        printf 'keyAlias=%s\npassword=%s\nstoreFile=/tmp/nexus-release.jks\n' \
          "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
          > src-tauri/gen/android/keystore.properties
    - name: 构建 APK
      script: |
        set -e
        npm ci
        npm run app:android -- --target aarch64 --apk
    - name: 创建 Release
      type: git:release
      options:
        title: "寻鸽工作台 ${CNB_BRANCH}"
        description: "Android 客户端安装包（arm64-v8a）。安装前需允许「未知来源」。"
    - name: 上传 APK 到 Release
      image: cnbcool/attachments:latest
      settings:
        attachments:
          - "./src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk"

# 打版本 Tag（v*）时出一版固定 tag 的镜像。
# ⚠️ 顶层键匹配的是「分支名**或 Tag 名**」: 这里必须写 "v*", 写 main 会变成
# 「名叫 main 的 Tag」而永不触发（且不报错）。tag 推送**不触发** GitHub 镜像 ——
# 那是刻意的（见文件开头 mirror 段的说明: tag_push 会把 GitHub 的 main 推回退）。
"v*":
  tag_push:
    - name: release-web-image
      services:
        - docker
      lock:
        key: build-web-image
        wait: true
        timeout: 1800
      stages:
        - <<: *quality-gate
        - name: docker build
          script: |
            set -e
            REPO="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build \
              --build-arg GIT_REVISION="${CNB_COMMIT}" \
              --build-arg PB_VERSION="${PB_VERSION:-0.40.2}" \
              -t "${REPO}:${CNB_BRANCH}" \
              -t "${REPO}:${CNB_COMMIT_SHORT}" \
              .
        - name: docker push
          script: |
            set -e
            REPO="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker push "${REPO}:${CNB_COMMIT_SHORT}"
            docker push "${REPO}:${CNB_BRANCH}"
    # Android APK：仅 tag 触发（见文件上方 .android-apk 的说明）
    - <<: *android-apk

main:
  push:
    - <<: *mirror-to-github
    - <<: *build-web-image
    - <<: *android-builder-image
  # crontab 的 key 必须带引号: 不加会因 * 触发 YAML 语法错误
  "crontab: 0 3 * * *":
    - <<: *mirror-to-github
