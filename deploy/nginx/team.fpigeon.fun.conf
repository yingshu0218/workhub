# team.fpigeon.fun → 寻鸽工作台（正式环境）
#
# 【服务器上的落点】/etc/nginx/sites-available/team.fpigeon.fun.conf
#                   软链到 /etc/nginx/sites-enabled/team.fpigeon.fun.conf
# 【本文件是仓库内的权威副本】deploy/nginx/team.fpigeon.fun.conf；改完同步过去。
#
# 后端：本机容器 workhub（镜像由 CNB 流水线构建，只绑 127.0.0.1:8790）
# TLS ：acme.sh 单独签发 —— 本域不属于 *.honeypani.fun，无法复用那张泛域名证书；
#       且 acme.sh 无 DNS API 凭据（泛域名签不了），故走 HTTP-01 + webroot。
#
# 本层只做反向代理，不承担访问控制 —— 安全防护由运维另行统一处理。
#
# ⚠️ 这一层**必须原样透传所有路径**：容器内的入口靠路径做同源路由
#    （/api、/_/ → PocketBase），若在这里只转发 / 会把 /api 也带走，
#    表现为「页面能开、数据全空」。
#
# 改后：nginx -t && systemctl reload nginx

# /relay 是 WebSocket：用 map 决定 Connection 头 —— 普通请求发 close、
# 升级请求发 upgrade（不能无条件写死 upgrade）。
# 变量名带站点前缀，避免与同机其它站点的同名 map 冲突。
map $http_upgrade $workhub_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name team.fpigeon.fun;

    # acme.sh 的 HTTP-01 挑战（与同机其它站点写法一致）
    location ^~ /.well-known/acme-challenge/ {
        root      /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 老写法把 http2 并进 listen：Ubuntu 24.04 源里是 nginx 1.24.0，
    # 独立的 `http2 on;` 要 1.25.1+，用它会在 nginx -t 报 unknown directive。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name team.fpigeon.fun;

    ssl_certificate     /etc/nginx/certs/team.fpigeon.fun.crt;
    ssl_certificate_key /etc/nginx/certs/team.fpigeon.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 附件 / 头像上传（PocketBase 有文件字段），留足余量
    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /relay 是 WebSocket 长连接：必须显式带上升级头，并把读超时放宽，
        # 否则握手在这里就断了 / 长连接会被 nginx 掐掉。
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $workhub_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
